# Nginx가 날짜 녹화 location에서 공유하는 Media 요청 경계를 적용한다.
if ($request_method !~ "^(GET|HEAD)$") { return 405; }
# Nginx가 정규화한 경로로 encoded path나 traversal 요청을 허용하지 않는다.
if ($request_uri !~ "^/media/daily-recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(hls/index\.m3u8|media/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}\.ts|content)(\?.*)?$") { return 404; }

set $daily_recording_args "";
set $daily_recording_download "$uri:$arg_download";
if ($daily_recording_download ~ "/content:true$") { set $daily_recording_args "download=true"; }
set $args $daily_recording_args;
rewrite ^/media/daily-recordings/(.*)$ /api/v2/daily-recordings/$1 break;

proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host $proxy_host;
proxy_set_header Connection "";
proxy_set_header Content-Length "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Accept-Encoding "";
proxy_set_header Range $http_range;
proxy_set_header If-Range $http_if_range;
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;
proxy_hide_header Cache-Control;
proxy_hide_header Location;
proxy_hide_header Content-Location;
sub_filter_types application/vnd.apple.mpegurl;
sub_filter_once off;
sub_filter '/api/v2/daily-recordings/' '/media/daily-recordings/';
proxy_buffering off;
proxy_cache off;
proxy_redirect off;
include /etc/nginx/security-headers.conf;
add_header Cache-Control "no-store" always;
add_header X-Accel-Buffering "no" always;
