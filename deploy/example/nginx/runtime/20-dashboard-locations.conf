# server context에 포함되는 API, SSE, 실시간 영상, 날짜 녹화와 썸네일 location이다.
# 이미지의 gzip 설정을 proxy 응답에도 적용한다.
gzip_proxied any;

# 브라우저 요청 body의 최대 크기를 정한다.
client_max_body_size 1m;

# 모니터링 SSE는 buffering 없이 긴 read timeout으로 전달한다.
location ~ ^/api/(v2/monitoring/events|v1/monitoring/events)$ {
    include /etc/nginx/includes/proxy-streaming.conf;
    proxy_pass http://dashboard_backend;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
}

# 나머지 API는 Backend에 전달한다.
location /api/ {
    include /etc/nginx/includes/proxy-common.conf;
    proxy_pass http://dashboard_backend;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# 영상 요청마다 Backend가 session과 camera 접근 권한을 검사한다.
location = /_dashboard_media_access {
    internal;
    proxy_pass http://dashboard_backend/api/v1/media/access;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
}

# 실시간 MJPEG와 이벤트 구간 파일은 Backend 검사 뒤 Cookie 없이 Media Service에 전달한다.
location ~ "^/media/(cameras/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}/live|clips/[0-9a-fA-F-]{36}/content)$" {
    if ($request_method != GET) { return 405; }
    auth_request /_dashboard_media_access;
    set $args $dashboard_media_args;
    rewrite ^/media/(.*)$ /api/v1/$1 break;
    proxy_pass http://dashboard_media;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# 날짜 녹화의 HLS 목록, segment와 MP4는 Backend 검사 뒤 Media Service에 전달한다.
location ~ "^/media/daily-recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(hls/index\.m3u8|media/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}\.ts|content)$" {
    auth_request /_dashboard_media_access;
    include /etc/nginx/includes/proxy-daily-recording.conf;
    proxy_pass http://dashboard_media;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# 썸네일 요청은 Backend가 검증하고 X-Accel-Redirect로 내부 경로를 지정한다.
location ~ "^/media/(clips|daily-recordings)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/thumbnail$" {
    include /etc/nginx/includes/proxy-thumbnail-auth.conf;
    proxy_pass http://dashboard_backend;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# Backend가 지정한 내부 경로에서 Media Service의 썸네일 이미지를 받는다.
location ~ "^/_thumbnail/(v1/clips|v2/daily-recordings)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/thumbnail$" {
    include /etc/nginx/includes/proxy-thumbnail-image.conf;
    proxy_pass http://dashboard_media;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

# 썸네일 내부 경로의 비정상 응답을 502로 바꾼다.
location @thumbnail_bad_response {
    include /etc/nginx/security-headers.conf;
    return 502;
}

# 허용하지 않은 날짜 녹화 경로를 거부한다.
location /media/daily-recordings/ {
    return 404;
}
