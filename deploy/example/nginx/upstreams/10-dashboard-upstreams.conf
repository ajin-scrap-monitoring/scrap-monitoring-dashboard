# HTTP context에 포함되는 Backend와 Camera Media Service upstream이다.
# server의 Docker service 이름과 port를 배포 환경의 값으로 바꾼다.
resolver 127.0.0.11 valid=10s ipv6=off;

# 구간 파일 다운로드 요청의 download query만 Media Service에 전달한다.
map "$uri:$arg_download" $dashboard_media_args {
    default "";
    "~^/media/clips/[0-9a-fA-F-]{36}/content:true$" "download=true";
}

upstream dashboard_backend {
    zone dashboard_backend 64k;
    server scrap-backend:8000 resolve;
}

upstream dashboard_media {
    zone dashboard_media 64k;
    server camera-media:8889 resolve;
}
