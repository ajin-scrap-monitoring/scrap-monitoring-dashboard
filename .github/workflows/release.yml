name: Release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  image:
    name: Build, verify and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag against main history
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          bash scripts/verify-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          fi
          image_name=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          VERSION: ${{ steps.image.outputs.version }}
        run: ./scripts/verify-container-image.sh "$IMAGE" scrap-monitoring-dashboard-release "$VERSION"

      - name: Verify TLS secret integration
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: ./test/tls/integration.sh "$IMAGE"

      - name: Verify reverse proxy integration
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: node test/proxy/integration.mjs "$IMAGE"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release image
        id: publish
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$VERSION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach deployment assets and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE_REFERENCE: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          release_directory=$(mktemp -d "$RUNNER_TEMP/dashboard-release.XXXXXXXX")
          bash scripts/prepare-release-assets.sh "$release_directory" "$IMAGE_REFERENCE"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Source: $GITHUB_SHA. Image: $IMAGE_REFERENCE. Runtime 설정 예시와 schema 및 Nginx 공개 설정을 함께 제공한다." \
            "$release_directory/runtime-config.example.json" "$release_directory/runtime-config.schema.json" \
            "$release_directory/nginx-config.tar.gz" "$release_directory/image-reference.txt" "$release_directory/SHA256SUMS"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
