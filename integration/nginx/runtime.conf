location = /api/v2/monitoring/events {
    include /etc/nginx/includes/proxy-streaming.conf;
    proxy_pass http://integration_backend;
    proxy_read_timeout 15s;
}

location /api/ {
    include /etc/nginx/includes/proxy-common.conf;
    proxy_pass http://integration_backend;
}

location = /_integration_media_auth {
    internal;
    proxy_pass http://integration_backend/api/v1/media/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
}

location ~ "^/media/(cameras/[A-Za-z0-9][A-Za-z0-9._~-]*/live|clips/[0-9a-fA-F-]{36}/content)$" {
    if ($request_method != GET) { return 405; }
    auth_request /_integration_media_auth;
    rewrite ^/media/(.*)$ /api/v1/$1 break;
    proxy_pass http://integration_media;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_hide_header Set-Cookie;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 10s;
}
