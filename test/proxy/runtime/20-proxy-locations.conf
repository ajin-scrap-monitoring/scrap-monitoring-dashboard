# 이 파일의 이름, 경로와 값은 컨테이너 통합 테스트 전용이다.
location ^~ /contract-api/ {
    client_max_body_size 16k;
    limit_req zone=proxy_test_api_rate burst=1 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    include /etc/nginx/includes/proxy-common.conf;
    proxy_pass http://proxy_test_api;
}

location ^~ /contract-signaling/ {
    client_max_body_size 16k;
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 5s;
    include /etc/nginx/includes/proxy-websocket.conf;
    proxy_pass http://proxy_test_signaling;
}

location ^~ /contract-events/ {
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 5s;
    include /etc/nginx/includes/proxy-streaming.conf;
    proxy_pass http://proxy_test_api;
}

location ^~ /contract-whep/ {
    client_max_body_size 16k;
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 5s;
    include /etc/nginx/includes/proxy-common.conf;
    proxy_pass http://proxy_test_signaling;
}

location = /contract-proxy-metrics {
    proxy_pass http://proxy_test_api/api/v1/proxy-test/metrics;
}

location = /_proxy_test_media_access {
    internal;
    proxy_pass http://proxy_test_api/api/v1/media/access;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
}

location ~ "^/media/daily-recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(hls/index\.m3u8|media/[A-Za-z0-9][A-Za-z0-9._~-]{0,127}\.ts|content)$" {
    auth_request /_proxy_test_media_access;
    include /etc/nginx/includes/proxy-daily-recording.conf;
    proxy_pass http://proxy_test_api;
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
}

location /media/daily-recordings/ {
    return 404;
}
