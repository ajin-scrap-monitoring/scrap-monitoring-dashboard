# 이 파일의 이름, 경로와 값은 컨테이너 통합 테스트 전용이다.
resolver 127.0.0.11 ipv6=off valid=1s;
limit_req_zone $binary_remote_addr zone=proxy_test_api_rate:10m rate=1r/s;

upstream proxy_test_api {
    zone proxy_test_api 64k;
    server proxy-integration-upstream:18081 resolve;
}

upstream proxy_test_signaling {
    zone proxy_test_signaling 64k;
    server proxy-integration-upstream:18081 resolve;
}
