server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/certs/dashboard-fullchain.pem;
    ssl_certificate_key /run/secrets/dashboard_tls_private_key;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
