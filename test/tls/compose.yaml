services:
  dashboard:
    image: "${TLS_TEST_IMAGE:?TLS_TEST_IMAGE is required}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - target: 8443
        host_ip: 127.0.0.1
    security_opt:
      - no-new-privileges:true
    secrets:
      - dashboard_tls_private_key
    volumes:
      - type: bind
        source: "${TLS_TEST_CERTIFICATE_FILE:?TLS_TEST_CERTIFICATE_FILE is required}"
        target: /run/certs/dashboard-fullchain.pem
        read_only: true
      - type: bind
        source: "${TLS_TEST_NGINX_CONFIG:?TLS_TEST_NGINX_CONFIG is required}"
        target: /etc/nginx/conf.d/tls-validation.conf
        read_only: true

secrets:
  dashboard_tls_private_key:
    file: "${TLS_TEST_PRIVATE_KEY_FILE:?TLS_TEST_PRIVATE_KEY_FILE is required}"
