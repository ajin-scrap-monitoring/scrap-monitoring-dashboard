services:
  development:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - development_node_modules:/app/node_modules

  verification:
    build:
      context: .
      target: verification
    init: true
    volumes:
      - .:/app
      - verification_node_modules:/app/node_modules

volumes:
  development_node_modules:
  verification_node_modules:
